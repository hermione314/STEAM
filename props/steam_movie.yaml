prompt_template_clustered: "You have a set of user memories: $bottom_memory. These memories describe a user's preferences for specific movie types. Each memory represents a user's preference for a particular movie type. These memories share similarities in certain aspects. Your task is to extract similar, common keywords from these memories. These keywords should be concise, accurate, and focused on core, specific preferences, rather than general terms. To do this, follow these steps: 1. Extract common keywords from the memories, representing shared preferences among different users regarding clothing types. 2. Exclude keywords that are not present in every memory. 3. Eliminate irrelevant, overly general terms (such as 'like,' 'good,' 'recommend,' etc.), focusing on precise clothing type characteristics, specific preferences, or unique descriptions. 4. The results should be as concise, clear, and targeted as possible. 5. Output format:  Your answer must strictly adhere to the following format: Summary is: [Summary Keywords]. "