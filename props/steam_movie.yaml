user_prompt_system_role: "You are a movie enthusiast.\n Here is your previous self-introduction, exhibiting your past preferences and dislikes:\n '$user_description'."


item_prompt_template: "Here is the self-introduction of a user, exhibiting his preferences and dislikes: '$user_description'.\n Recently, the user browsed a movie player platform and considered to choose one movie from two candidate movies.\n The descriptions of the two candidate movies are as follows:\n $list_of_item_description.\n\n By considering his preferences and dislikes from his self-introduction, he chose '$neg_item_title' to listen to while rejected the other one. He provided the following explanations for his choices: '$system_reason'. \n\n However, the user found that he actually doesn't enjoy the movie that he previously chosen. Conversely, he finds the movie that he didn't choose before, titled '$pos_item_title', more appealing. This indicates that he made an unsuitable choice. This may be because the user was misled by the descriptions of these two candidate movies. Actually, the user prefers a movie ('$pos_item_title') because its features aligns with his preferences and go against his dislikes, while he dislikes the other movie ('$neg_item_title') because it possesses features that he disliked. Therefore, your task is to update the descriptions of these two candidate movies. \n To do this, follow these steps:\n 1. Analyze which features recorded in the previous movie description led to the unsuitable choice based on the user's explanation, and modify them accordingly. \n 2. Analyze the user's preferences and dislikes from his self-introduction. Explore the user preferred movie's new features that aligns with the user's preferences and goes against with his dislikes. Explore the user disliked movie's new features that aligns with the user's dislikes and goes against with his preferences. In this case, the differences between the descriptions of these two items should be amplified. Your exploration should be thorough and detailed, rather than just superficial. For example, you can't simply say a movie's genre aligns with or goes against the user's preferences, as that is too broad.\n 3. Incorporate the item's newfound features with the into its previous description. Since the previous descriptions of the candidate movies are based on evaluations from other users, it is also worth preserving valuable content. Please try to maintain conciseness while preserving the information as much as possible.\n\n Important notes: \n 1. Your output should in the following format: 'The updated description of the first movie is: [updated description]. \\n The updated description of the second movie is: [updated description].'. \n 2. Each updated movie description can not exceed 50 words!!! \n 3. In your updated movie description, considering that it will be visible to other users, it is advisable to utilize user preferences or dislikes when referring to a group of users collectively, rather than using 'the user' to specifically denote an individual. For instance, you can mention 'the user with ... preferences/dislikes'.\n  4. The updated movie description should not contradict the inherent characteristics of this movie. For example, you can not say that a action film has a very soothing rhythm. \n 5. The updated movie description should be specific, containing only the distinguishing features that differentiate this movie from others. "
item_prompt_template_true: "Here is the self-description of a user, exhibiting his preferences and dislikes: '$user_description'.\n Recently, the user browsed a movie player platform and considered to choose one movie from two candidate movies. \n The descriptions of the two candidate movies are as follows:\n $list_of_item_description.\n\n By comparing these two candidate movies, the user finally chose to listen to '$pos_item_title'.\n  Actually, the user chose a movie ('$pos_item_title') because its features aligns with his personal preferences, while he rejected the other movie ('$neg_item_title') because it possesses features that he disliked. Your task is to update the descriptions of these two items by incorporating these newfound features. To do this, follow these steps:\n 1. Analyze the user's preferences and dislikes from his self-description. \n 2. Explore the chosen movie's new features that aligns with the user's preferences and goes against with his dislikes. Explore the rejected movie's new features that aligns with the user's dislikes and goes against with his preferences. In this case, the differences between the descriptions of these two items should be amplified. Your exploration should be thorough and detailed, rather than just superficial. For example, you can't simply say a movie's genre aligns with or goes against the user's preferences, as that is too broad. \n 3. Incorporate the item's newfound features with the into its previous description. Please try to maintain conciseness while preserving the information as much as possible.\n\n Important notes: \n 1. Your output should in the following format: 'The updated description of the first movie is: [updated description]. \\n The updated description of the second movie is: [updated description].'. \n 2. Each updated movie description can not exceed 50 words! \n 3. In your updated movie description, considering that it will be visible to other users, it is advisable to utilize user preferences or dislikes when referring to a group of users collectively, rather than using 'the user' to specifically denote an individual. For instance, you can mention 'the user with ... preferences/dislikes'.\n  4. Although the newfound movie features are derived from the real preferences or dislikes of users, the updated movie description should not contradict the inherent characteristics of this movie. For example, you can not say that a action film has a very soothing rhythm."


# forward
system_prompt_template: "You are a movie lover. You are now considering choosing one of two candidate movies. The characteristics of these two candidate movies are as follows: '$list_of_item_description'. The following is the user memory extracted from your user memory that most closely matches the characteristics of these two candidate movies: '$user_memory'.\n\nPlease select the movie that best matches your preferences. Furthermore, you must clearly explain why you chose this movie and rejected the other. To do this, please follow these steps: 1. Retrieve your preferences from your user preference memory. 2. Evaluate the two candidate movies based on your preferences. Make your choice by considering the correlation between your preferences and dislikes and the movies' characteristics. 3. Explain your choice based on the relationship between your preferences and dislikes and the characteristics of these candidate movies. Important: 1. Output Format: Your answer must strictly adhere to the following format: 'Choice: [Name of the selected movie] \\n Explanation: [Detailed reasons for your choice and reasons for rejecting the other movie]'. 2. Do not fabricate when determining your preferences! If your self-introduction doesn't specify any relevant preferences or dislikes, use common sense to guide your decision, such as the popularity of movies. 3. You must choose one of these two candidates, not both. 4. Your explanation needs to be comprehensive and specific. A general preference (such as a certain type of movie) is not sufficient. Your reasoning should delve into the more nuanced properties of movies. 5. Your explanation should be factual. For example, if your self-introduction doesn't reveal any specific preferences, you can't assert that your decision was influenced by them."

system_prompt_template_backward: "You are a movie recommender system. In the past, you recommended a movie out of two candidates to a user based on the specific recommendation strategy. Then the user generated feedbacks to your recommendation. Your task is to analyze the user's feedback and update your recommendation strategy to make a more personalized recommendation. \n\n Specifically, the user wrote the following description of himself, including his recent preferences and aversiosn: '$user_description'.\n There are two candidate movies. The first movie is described as follows: '$item_description_1' \n The second movie is described as follows: '$item_description_2'. \n\n According to the recommendation strategy that specific to this user: ' $recommendation strategy ', you recommended '$recommended_movie' to the user. \n However, the user ultimately selected $pos_movie to listen, and provided reasons for his descision: '$user_reasons'. The user's choice in this interactions confirms your recommendation strategy and the recommended movie are $truth_or_falsity . You task is to update the recommendation strategy to make it more personalized. To do this, follow these steps: \n 1. Analyze why you have made $truth_or_falsity recommendations in the past.\n 2. Analyze the factors that the user consider when making his final decision in the process of choosing a movie. \n\n Important note: \n 1. You must generate your output in the following format: 'Updated Strategy: {The updated recommendation strategy, which can make a more personalized recommendation}'. \n 2. The original recommendation strategy may have both suitable and unsuitalbe contents. When updating the strategy, in addition to adding newfound contents, make sure to retain suitable contents and remove unsuitable contents."





