user_prompt_template_true: "Recently, you considered choosing one of two candidate movies. The characteristics of these two candidate movies are as follows: $list_of_item_description. After comparing the two candidate movies, you chose '$pos_item_title' to listen to and rejected the other. You provided the following explanation for your choice, revealing your prior preference judgment between the two movies: '$system_reason'. Congratulations! After actually listening to both movies, you found that you like the movie you initially chose ('$pos_item_title') very much, and you indeed do not like the movie you had not chosen ('$neg_item_title'). \n\nThis indicates that your choice was correct, and the judgments about your preferences recorded in your explanation were basically correct. Therefore, your current task is to update your personal memories to record your true preferences. To do this, please follow the steps below: 1. Analyze your judgments about your own preferences, which are recorded in your explanation. 2. Based on the characteristics of the movie you truly like ('$pos_item_title'), explore multiple facets of your preferences, and determine your true preferences from the differential features between the movie you truly dislike ('$neg_item_title') and the one you truly like ('$pos_item_title') (that is, personal preferences generally arise only from differential features); 3. Analyze the incomplete aspects in your previous explanation of preference judgments, describe the new preferences revealed in this interaction, compare them with those reflected in your memories, and add details to incomplete memories. 4. Generate your personal preference memory, refined to a personalized level of granularity (for example, 'Growth Theme', 'tense and suspenseful story atmosphere', 'Fast-paced editing and dark humor', for reference only). \n\nOutput format to be followed strictly: 1) For each memory, your reflective output should use the following format: 'My updated personal memory: [fill in your summary for each memory]'. 2) the names of the candidate movies must not appear in your personal memory. 3) Your updated personal memory must be concise and not exceed 100 characters. 4) Your personal memory must not contain any generic evaluations or generalizations. 4) Your personal memory should describe only the characteristics of the movie you like. 5) You do not need to mention any wrong choices or thinking processes when generating personal memory. 6) Your personal memory should be specific and personalized. Any likes or dislikes that cannot distinguish you from others are not worth recording."

user_prompt_template_consolid: "Recently, you considered choosing one of two candidate movies. The features of these two candidate movies are as follows: $list_of_item_description. To make a choice aligned with your musical taste, you searched your personal memories; the memories whose styles and features are similar to these two candidate movies are: $user_memory. After comparing the two candidate movies based on your relevant memories, you chose to listen to '$pos_item_title' and rejected the other. You provided the following explanation for your choice, revealing your earlier preference judgment between the two movies: $system_reason. Congratulations! After actually listening to both movies, you found that you like the movie you initially chose ('$pos_item_title') very much, and you strongly dislike the movie you previously rejected ('$neg_item_title'). \n\nThis indicates that your choice was correct, and the judgments about your preferences recorded in your explanation were basically correct. However, you should also note that the retrieved memories influence your current choice, and these memories may still have an 'incomplete' problem (directionally correct but missing key qualifiers such as theme/plot summary/characters&archetypes/mood/style/cast&director signature/audience appeal). Therefore, your current task is further reflection (judging whether memories have problems) and consolidation (reinforcing the parts of the memories that match the user's true preferences). \n\nTo do this, follow these steps: 1) Explore your multifaceted preferences based on the characteristics of the movie you truly like ('$pos_item_title'), and determine your true preferences from the differential features between the movie you truly dislike ('$neg_item_title') and the one you truly like ('$pos_item_title') (that is, personal preferences generally come only from differential features); 2) Analyze the incomplete aspects in your previous explanation of preference judgments, describe the new preferences revealed in this interaction, compare them with those reflected in the memories, and add details to incomplete memories. 3) Generate your personal preference memory, refined to a personalized level of granularity (for example, 'Growth Theme', 'tense and suspenseful story atmosphere', 'Fast-paced editing and dark humor', for reference only). \n\nOutput format to be followed strictly: 1) For each memory, your reflective output should use the following format: 'My updated personal memory: [fill in your update for each memory]'. 2) Your updated personal memory must be concise and not exceed 100 characters. 3) Your personal memory must not contain any generic evaluations or generalizations. 4) Your personal memory should describe only the characteristics of the movie you like; do not include the names of the candidate movies. 5) You do not need to mention any wrong choices or thinking processes when updating personal memory. 6) Your personal memory should be specific and personalized. Any likes or dislikes that cannot distinguish you from others are not worth recording."

user_prompt_template_update: "Recently, you were considering choosing one of two movies with the following characteristics: $list_of_item_description. To make a choice that matched your musical taste, you retrieved your personal memory and found a memory with similar characteristics to the two movies: $user_memory. After comparing the two candidates based on your relevant memories, you chose to listen to '$neg_item_title' and rejected the other. You provided the following explanation for your choice, revealing your prior preference for the two movies: '$system_reason.' However, after actually listening to both movies, you discovered that you did not like the movie you initially selected ('$neg_item_title'), and preferred the movie you had not previously chosen ('$pos_item_title'). This indicates that your choice was incorrect, and your interpretation of your preferences was also incorrect. The retrieved memory influenced your current choice. There are two possibilities: the preferences described in your memory are significantly different from the description of your actual favorite movie $pos_item_title (for example, the memory says 'I like Suspense and mystery movies' but the movie's description is 'comedy film'), or the preferences described in your memory and the actual favorite movie $pos_item_title are largely consistent, but incomplete (for example, the memory says 'I like heartwarming and healing coming-of-age film' but the movie's description is 'Heartwarming Movies'). These two possibilities are called 'irrelevant' and 'incomplete,' respectively. Therefore, your task is to identify the memory problem (you can only choose between 'irrelevant' and 'incomplete') and generate a new memory of your personal preferences. To do this, follow these steps: 1) Explore your multifaceted preferences based on the features of the movies you truly like ('$pos_item_title') and determine your true preference based on the differential features between the movies you truly dislike ('$neg_item_title') and the movies you truly like ('$pos_item_title'). (i.e., your personal preference is based solely on the differential features.) 2) Analyze any misunderstandings in your previous interpretation of your preference judgments, identify issues with your original memory, and correct these errors. 3) Generate your personal preference memory, refining it to a personalized level of granularity (e.g., 'Growth Themes,' 'Teamwork Portrait' 'Fast-paced editing and dark humor,' etc., for reference only). Important: First, based on your reasoning, identify issues with each memory as 'irrelevant' or 'incomplete', then generate an updated personal memory. Describe the new preferences revealed in this interaction, compare them with the preferences reflected in your memory, filter out irrelevant memories, and fill in missing details for incomplete memories. Output format (must be strictly followed): 1) For each memory, your reflection output must use the following format: 'Memory misjudgment: [fill in your judgment of this memory], my updated personal memory: [fill in your update of this memory].' 2) If no user memory is provided, you should only output your generated personal preference memory. 3) Your updated personal memory must be concise and not exceed 100 characters. 4) Your personal memory must not contain any general comments or summaries. 5) Your personal memory should only describe the characteristics of the movies you prefer; do not include the names of candidate movies. 6) When updating your personal memory, you do not need to mention any dislike aspects or thought processes. 7) Your personal memory must be specific and personalized. Any likes and dislikes that do not distinguish you from others are not worth recording."

user_prompt_template_inference: "Recently, you selected some movies, reflecting your listening tastes. You also explained your choices. Explanations that truly align with your preferences form your personal memory. Along with your memory, we also recorded the corresponding movie choices. We sorted your hot memories, $hot_mem, and your cold memories, $cold_mem, by the number of movie choices. Your task is to summarize your overall interests based on these two memories, highlighting your hot interests while not neglecting your cold ones. The output format must be strictly adhered to: 1. Your reflection on each memory should use the following format: 'Summary User Memory: [Please fill in your updates for each memory here].' 2. Your summary of your personal memory should not exceed 300 words. 4. Your personal memory must not contain any generalizations or generalizations. 5. Your personal memory should only describe the characteristics of the movies you liked; the names of candidate movies should not be included in your personal memory. 6. You do not need to mention any dislike aspects or the thought process behind summarizing your personal memory. 7. Your personal memory should be specific and personalized. Any likes and dislikes that do not distinguish you from others are not worth recording."

prompt_template_linked: "You are a movie lover and are considering choosing between two candidate movies. The characteristics of these two candidate movies are as follows: '$list_of_item_description'. The following is the user memory extracted from your user memory that most closely matches the characteristics of these two movies: '$user_memory'. Also, due to homogeneity in recommender systems, users tend to choose movies chosen by other users with similar interests. Therefore, you also review the memories of related users and their chosen movies: $linked_info. Please select the movie that best matches your preferences. Furthermore, you must clearly explain why you chose one movie and rejected the other. To do this, follow these steps: 1. Retrieve your preferences from your user preference memory. 2. Evaluate the two candidate movies based on your preferences. Make your choice by considering the correlation between your likes and dislikes and the movie characteristics. 3. Explain your choice based on the relationship between your likes and dislikes and the characteristics of the two candidate movies. Important Tips: 1. Output Format: Your answer must strictly follow the following format: 'Choice: [Name of the movie you selected] \n Explanation: [Detailed reasons for your choice and your reasons for rejecting the other movie]. 2. Don't make up your mind when determining your preferences! If your introduction doesn't specify your preferences, use common sense, such as the popularity of movies, to guide your decision. 3. You must choose one of these two candidates, not both. 4. Your explanation needs to be comprehensive and specific. General preferences (such as a certain type of movie) are not enough. Your reasoning should delve into the more nuanced attributes of the movie. 5. Your explanation should be based on facts. For example, if your introduction doesn't reveal any specific preferences, you can't assert that your decision was influenced by them."

user_prompt_template: "Recently, you considered choosing between two candidate movies. The characteristics of these two candidates are as follows: $list_of_item_description. After comparing the two candidates, you chose to listen to '$neg_item_title' and rejected the other. You gave the following explanation for your choice, revealing your previous judgment of preference between the two movies: $system_reason. However, after actually listening to both movies, you discovered that you did not like the movie you initially selected ('$neg_item_title'), but preferred the movie you did not choose ('$pos_item_title'). This indicates that your choice was incorrect and your interpretation of your preferences was incorrect. You currently have no personal memory, so your task is to generate a personal preference memory based on the likes and dislikes you expressed during this interaction. To do this, follow these steps: 1. Analyze your previous interpretation of your preferences and correct it. 2. Explore your multifaceted preferences based on the characteristics of movies you truly enjoy ('$pos_item_title'). Determine your true preference based on the differences between movies you truly dislike ('$neg_item_title') and movies you truly enjoy ('$pos_item_title'). (This means personal preferences generally stem only from differences.) 3. Generate your personal preference memory. This should be detailed to a personalized level (e.g., 'Growth Themes,' 'Teamwork Portrait' 'Chinese, Cantonese, and English,' etc., for reference only). Important Notes: 1. Your output should use the following format: 'My updated personal memory: [Please write your updated personal memory here].' 2. Your updated personal memory must be concise and no longer than 100 words. 3. Your personal memory should not contain any general comments or summaries. 4. Your personal memory should only describe the characteristics of the movies you like, without mentioning any dislike aspects or the thought process behind updating your personal memory. 5. Your personal memory should only describe the characteristics of the movies you enjoy; do not include the names of the candidate movies. 6. When updating your personal memories, you do not need to mention any wrong choices or thought processes. 7. Your personal memories must be specific and personal. Any likes/dislikes that do not distinguish you from others are not worth recording."

