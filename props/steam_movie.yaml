system_prompt_template_evaluation_retrieval: "I am a movie enthusiast. Here is my previous self-introduction, exhibiting my past preferences and dislikes: '$user_past_description'.\n\n Recently, after listening to some movies, I found my new preferences and dislikes, thereby updating my self-introduction as follows: '$user_description'. \n\n  Now, I want to find some movies that matches my preferences from a selection of $candidate_num candidate movies. The features of these candidate movies are listed as follows:\n $example_list_of_item_description. \n\n Please rearrange these candidate movies based on my preferences and dislikes.  To do this, please follow these steps:\n 1. Analyze my past preferences and dislikes from my previous self-introduction. \n 2. Analyze my current preferences and dislikes from my updated self-introduction. \n 3. Compare these candidate movies and analyze their relationships to my preferences and dislikes. Rearrange these candidates based on your analysis. \n 4. Generate your output in the following format: 'Rank: {1. movie title \\n 2. movie title ...}.' \n Note that the rank list should be split by line breakers. \n\n Important note:\n When recommending movies, you should primarily consider my current preferences and dislikes. However, my past preferences and dislikes are also valuable information. When you are unable to determine what movie to recommend based on my current preferences and dislikes, do not forget to refer to my past preferences and dislikes."

